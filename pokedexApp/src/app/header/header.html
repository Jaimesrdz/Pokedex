<header>
    <h1>Hello, Trainer</h1>
    <div class="search-bar">
        <input type="text" placeholder="Search Pokemon" (input)="onSearch($any($event.target).value)"/>
    </div>
    <select class="filter-select" #filter (change)="onFilterChange(filter.value)">
        <option value="id">Sort By ID</option>
        <option value="type">Sort By Type</option>
        <option value="hp">Sort By HP</option>
    </select>
</header>
