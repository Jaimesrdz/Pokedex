<button class="back-button" (click)="loadPreviousPage()">
    <img src="https://img.icons8.com/?size=50&id=59987&format=png" alt="Previous" />
</button>
<button class="next-button" (click)="loadNextPage()">
    <img src="https://img.icons8.com/?size=50&id=59987&format=png" alt="Next" />
</button>
<div class="card-container">
    <div class="card" *ngFor="let pokemon of displayedList">
        <div class="card-header">
            <img [src]="pokemon.sprites.front_default || ''" alt="sprite" />
        </div>
        <div class="card-info">
            <p>{{ pokemon.name }}</p>
            <p>Type: {{ pokemon.types[0].type.name}}</p>
            <p>HP: {{ pokemon.stats[0].base_stat }}</p>
            <p>ATK: {{ pokemon.stats[1].base_stat }}</p>
        </div>
    </div>
</div>
<button class="back-button" (click)="loadPreviousPage()">
    <img src="https://img.icons8.com/?size=50&id=59987&format=png" alt="Previous" />
</button>
<button class="next-button" (click)="loadNextPage()">
    <img src="https://img.icons8.com/?size=50&id=59987&format=png" alt="Next" />
</button>
